name: market-council-audit-lab
services:
  api:
    build: ./api
    restart: unless-stopped
    environment:
      PORT: '3001'
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in .env}
      MONGODB_DB: ${MONGODB_DB:-market_council_audit}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in .env}
      BROKER_SHARED_SECRET: ${BROKER_SHARED_SECRET:?Set BROKER_SHARED_SECRET in .env}
      BROKER_URL: http://broker:3002
      DATA_MODE: ${DATA_MODE:-sample}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      ENABLE_LLM: ${ENABLE_LLM:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      EXECUTION_DELAY_MS: ${EXECUTION_DELAY_MS:-6500}
    depends_on:
      - broker
    networks:
      - private
  broker:
    build: ./broker
    restart: unless-stopped
    environment:
      PORT: '3002'
      BROKER_SHARED_SECRET: ${BROKER_SHARED_SECRET:?Set BROKER_SHARED_SECRET in .env}
      ORDERS_PATH: /data/orders.json
    volumes:
      - paper-orders:/data
    networks:
      - private
  web:
    build: ./web
    restart: unless-stopped
    ports:
      - '127.0.0.1:${WEB_PORT:-3187}:80'
    depends_on:
      - api
    networks:
      - private
networks:
  private:
volumes:
  paper-orders:
